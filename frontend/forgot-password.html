<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Multi-Agent AI BI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a secure link to reset your password</p>
            </div>

            <!-- Error Banner -->
            <div id="authAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

            <!-- Success Banner -->
            <div id="authSuccess" class="alert alert-success py-2 px-3 small d-none" role="alert"></div>

            <!-- Dev Token Banner -->
            <div id="devTokenCard" class="card bg-light border-primary p-3 mb-3 d-none">
                <div class="d-flex align-items-center mb-1">
                    <i class="bi bi-info-circle-fill text-primary me-2"></i>
                    <strong class="small text-primary">Development Mode Detected</strong>
                </div>
                <p class="small text-secondary mb-2">Since email service credentials are not configured locally, use this generated recovery link directly:</p>
                <a id="devResetLink" href="#" class="btn btn-sm btn-outline-primary text-truncate">
                    <i class="bi bi-link-45deg me-1"></i> Proceed to Reset Password
                </a>
            </div>

            <!-- Form -->
            <form id="forgotPasswordForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label-custom">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" id="email" class="form-control form-control-custom border-start-0" placeholder="analyst@enterprise.com" required autocomplete="email">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-2 fs-6 justify-content-center mb-3">
                    <i class="bi bi-send me-1"></i> Send Reset Instructions
                </button>

                <div class="text-center">
                    <a href="login.html" class="text-decoration-none small text-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/password-reset.js"></script>
</body>
</html>
