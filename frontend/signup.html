<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Multi-Agent AI BI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card auth-card-wide">
            <div class="auth-header">
                <div class="brand-icon">
                    <i class="bi bi-cpu-fill"></i>
                </div>
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-subtitle">Join the Enterprise Multi-Agent Business Intelligence Platform</p>
            </div>

            <!-- Error Banner -->
            <div id="authAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

            <!-- Sign Up Form -->
            <form id="signupForm" novalidate>
                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label-custom">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" id="fullName" class="form-control form-control-custom border-start-0" placeholder="e.g. Atharv Sharma" required autocomplete="name">
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label-custom">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" id="email" class="form-control form-control-custom border-start-0" placeholder="analyst@enterprise.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label-custom">Password</label>
                    <div class="input-group input-group-password">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                        <input type="password" id="password" class="form-control form-control-custom border-start-0" placeholder="At least 8 characters" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <!-- Live Password Strength Meter -->
                    <div class="password-strength-bar">
                        <div id="strengthFill" class="password-strength-fill"></div>
                    </div>
                    <div class="strength-text">
                        <span id="strengthLabel">Enter password</span>
                        <span>Min 8 chars, 1 uppercase, 1 digit, 1 symbol</span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label-custom">Confirm Password</label>
                    <div class="input-group input-group-password">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-check2-circle"></i>
                        </span>
                        <input type="password" id="confirmPassword" class="form-control form-control-custom border-start-0" placeholder="Re-enter password" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="toggleConfirmPasswordBtn" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="passwordMismatchHint" class="text-danger small mt-1 d-none">Passwords do not match</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-2 fs-6 justify-content-center">
                    <i class="bi bi-person-plus-fill me-1"></i> Create Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-secondary small">Already have an account? </span>
                <a href="login.html" class="fw-semibold text-primary text-decoration-none small">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
