<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Multi-Agent AI BI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h1 class="auth-title">Set New Password</h1>
                <p class="auth-subtitle">Create a secure new password for your account</p>
            </div>

            <!-- Error Banner -->
            <div id="authAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

            <!-- Success Banner -->
            <div id="authSuccess" class="alert alert-success py-2 px-3 small d-none" role="alert"></div>

            <!-- Reset Form -->
            <form id="resetPasswordForm" novalidate>
                <!-- Hidden / Token display -->
                <input type="hidden" id="resetToken" name="token">

                <!-- New Password -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label-custom">New Password</label>
                    <div class="input-group input-group-password">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" id="newPassword" class="form-control form-control-custom border-start-0" placeholder="Min. 8 characters" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="toggleNewPasswordBtn" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <!-- Password Strength Meter -->
                    <div class="password-strength-container mt-2">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="password-strength-label text-muted small">Strength: <strong id="strengthText" class="text-secondary">None</strong></span>
                        </div>
                        <div class="progress" style="height: 6px;">
                            <div id="strengthProgressBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label-custom">Confirm New Password</label>
                    <div class="input-group input-group-password">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" id="confirmPassword" class="form-control form-control-custom border-start-0" placeholder="Re-enter new password" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="toggleConfirmPasswordBtn" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="passwordMismatchFeedback" class="small text-danger mt-1 d-none">
                        Passwords do not match.
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-2 fs-6 justify-content-center mb-3">
                    <i class="bi bi-check-circle me-1"></i> Update Password
                </button>

                <div class="text-center">
                    <a href="login.html" class="text-decoration-none small text-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/password-reset.js"></script>
</body>
</html>
