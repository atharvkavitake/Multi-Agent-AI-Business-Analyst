<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Multi-Agent AI BI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon">
                    <i class="bi bi-cpu-fill"></i>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your Multi-Agent BI workspace</p>
            </div>

            <!-- Error Banner -->
            <div id="authAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

            <!-- Success Banner (e.g. from password reset) -->
            <div id="authSuccess" class="alert alert-success py-2 px-3 small d-none" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label-custom">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" id="email" class="form-control form-control-custom border-start-0" placeholder="analyst@enterprise.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label-custom mb-0">Password</label>
                        <a href="forgot-password.html" class="text-primary small text-decoration-none">Forgot Password?</a>
                    </div>
                    <div class="input-group input-group-password">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                        <input type="password" id="password" class="form-control form-control-custom border-start-0" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small text-secondary" for="rememberMe">
                            Remember me for 30 days
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-2 fs-6 justify-content-center mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>

                <!-- Guest Evaluation Mode -->
                <button type="button" id="guestBtn" class="btn btn-outline-custom w-100 py-2 justify-content-center">
                    <i class="bi bi-person-workspace text-primary me-1"></i> Instant Demo as Guest
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-secondary small">Don't have an account? </span>
                <a href="signup.html" class="fw-semibold text-primary text-decoration-none small">Create Account</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
